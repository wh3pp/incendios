[project]
name = "fireca"
version = "0.1.0"
description = "Simulador de propagación de incendios forestales mediante autómatas celulares bidimensionales"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Equipo TIF - Física Computacional" },
]
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "pillow>=10",
]

[project.scripts]
fireca = "fireca.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fireca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
